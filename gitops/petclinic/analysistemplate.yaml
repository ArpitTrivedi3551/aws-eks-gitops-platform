apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: petclinic-success-rate
  namespace: petclinic
spec:
  metrics:
    - name: success-rate
      interval: 30s
      count: 3
      successCondition: result[0] >= 0.95   
      failureLimit: 1
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
          query: |
            sum(rate(http_server_requests_seconds_count{status!~"5..",namespace="petclinic"}[2m]))
            /
            sum(rate(http_server_requests_seconds_count{namespace="petclinic"}[2m]))
