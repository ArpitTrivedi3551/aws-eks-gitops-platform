apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: petclinic
  namespace: petclinic
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app: petclinic }
  template:
    metadata:
      labels: { app: petclinic }
    spec:
      containers:
        - name: petclinic
          image: arpittrivedi0203545/petclinic:latest  
          ports: [{ containerPort: 8080 }]
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: "postgres" }
            - { name: SPRING_SQL_INIT_MODE, value: "never" }
            - name: SPRING_DATASOURCE_URL
              valueFrom: { secretKeyRef: { name: petclinic-db, key: url } }
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: { secretKeyRef: { name: petclinic-db, key: username } }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: petclinic-db, key: password } }
          readinessProbe: { httpGet: { path: /actuator/health, port: 8080 }, initialDelaySeconds: 40, periodSeconds: 10 }
          livenessProbe:  { httpGet: { path: /actuator/health, port: 8080 }, initialDelaySeconds: 60, periodSeconds: 20 }
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause: { duration: 30 }         
        - setWeight: 50
        - pause: { duration: 30 }
        - setWeight: 100
