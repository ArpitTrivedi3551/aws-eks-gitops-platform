apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets
  namespace: petclinic
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef: { name: external-secrets-sa }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: petclinic-db
  namespace: petclinic
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets, kind: SecretStore }
  target:
    name: petclinic-db
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
        url: "jdbc:postgresql://{{ .host }}:{{ .port }}/{{ .dbname }}"
  dataFrom:
    - extract:
        key: senior-devops-staging-db-credentials
